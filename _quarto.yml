abstract: >+
 Multi-objective optimization problems are commonly solved using evolutionary algorithms, which typically terminate after a user-defined number of generations without guaranteeing solution optimality. Stopping criteria can address this limitation by determining when the algorithm has converged to high-quality solutions. This study compares four existing stopping criteria and proposes a novel criterion designed to balance computational cost and solution quality. The criteria are first evaluated on classical multi-objective benchmark problems, then applied to test cases where optimal solutions are known and can be compared with those obtained after implementing each stopping criterion. Finally, the criteria are applied to a food process optimization case study. This analysis identifies the most effective criterion for achieving this trade-off in practical applications.
keywords: [Multi-objective optimization, Stopping criteria, Evolutionary algorithms, Evaluation metrics, Food process optimization]
